{% block content %}
  <div class="accordion-item">
    <h2 class="accordion-header" id="job-submission-heading">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#job-submission-collapse" aria-expanded="false" aria-controls="job-submission-collapse">RUN OPTIMIZATION</button>
    </h2>
    <div id="job-submission-collapse" class="accordion-collapse collapse" aria-labelledby="job-submission-heading" data-bs-parent="#accordionFlushExample">
      <div class="accordion-body">
        <form id="optimization-settings-forms">
          {% csrf_token %}
          <div class="mb-3">
            <label for="hpc-selector" class="form-label">Select HPC Platform:</label>
            <select class="form-select" id="hpc-selector" name="hpc">
              <option value="CINECA - G100">CINECA - G100</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="job-name" class="form-label">Job Name:</label>
            <input type="text" class="form-control" id="job-name" name="job_name" maxlength="32" aria-describedby="job-name-help" />
            <div id="job-name-help" class="form-text">Enter the job name (max 32 characters).</div>
          </div>
          <div class="mb-3">
            <label for="runtime" class="form-label">Runtime (hours):</label>
            <input type="number" class="form-control" id="runtime" name="runtime" min="0.1" max="24" step="0.1" value="2.0" aria-describedby="runtime-help" />
            <div id="runtime-help" class="form-text">Set the runtime in hours.</div>
          </div>
          <div class="mb-3">
            <label for="nodes-number" class="form-label">Number of nodes:</label>
            <input type="number" class="form-control" id="nodes-number" name="nodes" min="1" max="64" value="1" aria-describedby="nodes-number-help" />
            <div id="nodes-number-help" class="form-text">Set the number of nodes.</div>
          </div>
          <div class="mb-3">
            <label for="core-number" class="form-label">Number of cores per node:</label>
            <input type="number" class="form-control" id="core-number" name="cores" min="1" max="64"  value="10" aria-describedby="core-number-help" />
            <div id="core-number-help" class="form-text">Set the number of cores per node.</div>
          </div>
          <button type="submit" class="btn btn-success w-100">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('optimization-settings-forms').addEventListener('submit', async function (event) {
      event.preventDefault()
      document.querySelector(`#optimization-settings-forms input`).classList.remove('is-invalid');;
      const url = '/hpc-integration/submit-job';
      const formData = new FormData(this);
      const response = await fetch(url, {
        method: 'POST',
        body: formData
      });
      if (response.ok) {
        showAlert("Job submitted successfully!", "success");
      } else {
        getError(response);
      }
    })
  </script>
{% endblock %}
