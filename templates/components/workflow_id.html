{% block content %}
<div class="d-flex justify-content-end align-items-center gap-3" style="color: white">
  <button type="button" class="btn btn-success btn-sm px-2 py-2" onclick="generateNewWf()">New workflow</button>
  <div class="d-flex align-items-center" style="cursor: pointer">
    <p id="wf_id" class="lbljobid">{{ workflow_id }}</p>
  </div>
</div>

<script>
  function generateNewWf() {
    const params = new URLSearchParams();
    fetch(`/reset`, {
      method: "GET",
    })
      .then((response) => {
        if (!response.ok) {
          throw new Error("Network response was not ok");
        }
        window.location.reload();
      })
      .catch((error) => {
        console.error("There was a problem with the fetch operation:", error);
      });
  }
</script>
{% endblock %}
