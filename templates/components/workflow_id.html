{% block content %} {% comment %}
<div class="d-flex justify-content-end align-items-center" style="color: white">
  <button type="button" class="btn btn-success" onclick="generateNewWf()">New workflow</button>
</div>
<div class="d-flex justify-content-end align-items-center" style="color: white">
  <div class="d-flex justify-content-center align-items-center" style="cursor: pointer; text-decoration: none; color: white">
    <p id="wf_id" class="me-1 mb-0">{{ workflow_id }}</p>
  </div>
</div>
{% endcomment %}

<div class="d-flex flex-column mx-auto">
  <button type="button" class="btn btn-success btn-sm px-2 py-1 mb-1" onclick="generateNewWf()"><i class="bi bi-plus-lg me-1"></i>New workflow</button>
  <p id="wf_id" class="lbljobid">NCV_ID: {{ workflow_id }}</p>
</div>

<script>
  function generateNewWf() {
    const params = new URLSearchParams();
    fetch(`/reset`, {
      method: "GET",
    })
      .then((response) => {
        if (!response.ok) {
          throw new Error("Network response was not ok");
        }
        window.location.reload();
      })
      .catch((error) => {
        console.error("There was a problem with the fetch operation:", error);
      });
  }
</script>
{% endblock %}
